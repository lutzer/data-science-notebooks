# Weights per livability variable. Values are relative — 90_scoring.ipynb
# normalizes them so they sum to 1. Set a weight to 0 to exclude a variable.
# Variables where lower is better (cost, crime) should be inverted in their
# source notebook so that higher raw values always mean "better".
#
# The socio-economic block is deliberately down-weighted because several of
# its variables measure closely related constructs (V-Dem corruption vs
# V-Dem liberal democracy; WHR happiness re-encodes income + freedom +
# social support; income / working_hours / healthcare / education /
# internet all track OECD membership). Equal 1.0 weights let that shared
# signal dominate the composite; the reduced weights below give it a fair
# share without triple-counting it.

# Geography & environment
sea_proximity: 0.83
terrain_ruggedness: 0.94
sun_hours: 0.68
temperature_pleasantness: 0.73
annual_greenness: 0.81
precipitation_balance: 0.75
climate_vulnerability: 0.56
natural_disaster_risk: 0.84
air_quality: 0.62
population_density: 0.72
urbanity: 0.71
internet_connectivity: 0.75
healthcare_access: 0.74
income: 0.56
cost_of_living: 0.68
crime_rate: 0.88
human_freedom: 0.72
corruption: 0.67
education: 0.59
people_happiness: 0.64
working_hours: 0.68
