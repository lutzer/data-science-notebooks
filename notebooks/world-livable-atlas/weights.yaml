# Weights per livability variable. Values are relative — 90_scoring.ipynb
# normalizes them so they sum to 1. Set a weight to 0 to exclude a variable.
# Variables where lower is better (cost, crime) should be inverted in their
# source notebook so that higher raw values always mean "better".

# Geography & environment
sea_proximity: 1.0
terrain_ruggedness: 1.0
sun_hours: 1.0
temperature_pleasantness: 1.0
annual_greenness: 1.0
precipitation_balance: 1.0
climate_vulnerability: 1.0
natural_disaster_risk: 1.0
air_quality: 1.0

# Population & infrastructure
population_density: 1.0
urbanity: 1.0
internet_connectivity: 1.0
healthcare_access: 1.0

# Social & economy
income: 1.0
cost_of_living: 1.0
crime_rate: 1.0
